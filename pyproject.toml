[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-evesde-factory"
description = "Factory helpers for faster application development with EVE SDE & AllianceAuth data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Geuthur", email = "devgeuthur@gmail.com" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5.2",
    "django-eveonline-sde>=0.2,<1",
]
optional-dependencies.tests-allianceauth-latest = [ "coverage", "factory-boy" ]
urls.Changelog = "https://github.com/Geuthur/aa-evesde-factory/blob/master/CHANGELOG.md"
urls.Discord = "https://discord.gg/WrHzA4rnxA"
urls.Documentation = "https://github.com/Geuthur/aa-evesde-factory/blob/master/README.md"
urls.Donations = "https://ko-fi.com/Geuthur"
urls.Homepage = "https://github.com/Geuthur/aa-evesde-factory"
urls.Source = "https://github.com/Geuthur/aa-evesde-factory"
urls.Tracker = "https://github.com/Geuthur/aa-evesde-factory/issues"

[tool.hatch]
version.path = "evesde_factory/__init__.py"
build.include = [
    "/evesde_factory",
]
